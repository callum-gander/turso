[package]
name = "turso_node"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Turso database library Node bindings"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Cairn: `conn_raw_api` gates the WAL-frame API (wal_state/wal_get_frame) a primary needs to serve
# pulls on the same connection the app uses. See `shared_connection()` below.
turso_core = { workspace = true, features = ["fts", "conn_raw_api"] }
turso_parser = { workspace = true }
napi = { version = "3.8.3", default-features = false, features = ["napi6"] }
napi-derive = { version = "3.5.2", default-features = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing.workspace = true
chrono = { workspace = true, default-features = false, features = ["clock"] }

[features]
browser = []
test_helper = ["turso_core/test_helper"]
tracing_release = ["turso_core/tracing_release"]
[build-dependencies]
napi-build = "2.3.1"
