[package]
name = "turso_sync_js"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Cairn: `lib` (rlib) added so the `cairn` crate can depend on this binding as a library, not only
# load it as a cdylib addon.
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "3.8.3", default-features = false, features = ["napi6"] }
napi-derive = { version = "3.5.2", default-features = true }
turso_sync_engine = { workspace = true }
turso_core = { workspace = true, features = ["fts"] }
turso_node = { workspace = true }
genawaiter = { version = "0.99.1", default-features = false }
tracing-subscriber = { workspace = true }
tracing.workspace = true

[build-dependencies]
napi-build = "2.3.1"

[features]
browser = ["turso_node/browser"]
